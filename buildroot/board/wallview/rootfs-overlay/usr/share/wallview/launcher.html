<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480, height=480, initial-scale=1">
<title>WallView</title>
<style>
@font-face {
	font-family: "Inter";
	src: url("fonts/InterVariable.woff2") format("woff2");
	font-weight: 100 900;
}
:root {
	--surface: #0F172A;
	--elevated: #1E293B;
	--key: #334155;
	--key-special: #1E293B;
	--text: #F8FAFC;
	--text-secondary: #94A3B8;
	--accent: #22D3EE;
	--primary: #0A84FF;
	--error: #EF4444;
}
html, body {
	position: relative;
	margin: 0;
	width: 480px;
	height: 480px;
	overflow: hidden;
	background: var(--surface);
	color: var(--text);
	font-family: "Inter", sans-serif;
	-webkit-user-select: none;
	user-select: none;
	cursor: none;
}
.view {
	position: absolute;
	inset: 0;
}
[hidden] {
	display: none !important;
}
#home {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 18px;
}
#logo {
	position: relative;
	width: 140px;
	height: 70px;
}
#logo > * {
	position: absolute;
	will-change: opacity;
}
#logo img {
	left: 0;
	top: 0;
	width: 100%;
}
#logo .glow {
	left: -20.8px;
	top: -20.8px;
	width: 181.6px;
	opacity: 0.1;
	animation: breathe 3.2s steps(6) infinite;
}
#logo .halo {
	left: -56.5px;
	top: -51.5px;
	width: 253px;
	height: 173px;
	background: radial-gradient(closest-side, rgba(10, 132, 255, 0.55), rgba(10, 132, 255, 0.16) 50%, rgba(10, 132, 255, 0));
	opacity: 0.1;
	animation: breathe 3.2s steps(6) infinite;
}
#logo .tint {
	opacity: 0;
	animation: tint 6.4s steps(12) infinite;
}
@keyframes breathe {
	0% { opacity: 0.100; }
	3.125% { opacity: 0.108; }
	6.25% { opacity: 0.130; }
	9.375% { opacity: 0.167; }
	12.5% { opacity: 0.217; }
	15.625% { opacity: 0.278; }
	18.75% { opacity: 0.347; }
	21.875% { opacity: 0.422; }
	25% { opacity: 0.500; }
	28.125% { opacity: 0.578; }
	31.25% { opacity: 0.653; }
	34.375% { opacity: 0.722; }
	37.5% { opacity: 0.783; }
	40.625% { opacity: 0.833; }
	43.75% { opacity: 0.870; }
	46.875% { opacity: 0.892; }
	50% { opacity: 0.900; }
	53.125% { opacity: 0.892; }
	56.25% { opacity: 0.870; }
	59.375% { opacity: 0.833; }
	62.5% { opacity: 0.783; }
	65.625% { opacity: 0.722; }
	68.75% { opacity: 0.653; }
	71.875% { opacity: 0.578; }
	75% { opacity: 0.500; }
	78.125% { opacity: 0.422; }
	81.25% { opacity: 0.347; }
	84.375% { opacity: 0.278; }
	87.5% { opacity: 0.217; }
	90.625% { opacity: 0.167; }
	93.75% { opacity: 0.130; }
	96.875% { opacity: 0.108; }
	100% { opacity: 0.100; }
}
@keyframes tint {
	0% { opacity: 0.000; }
	3.125% { opacity: 0.007; }
	6.25% { opacity: 0.027; }
	9.375% { opacity: 0.059; }
	12.5% { opacity: 0.103; }
	15.625% { opacity: 0.156; }
	18.75% { opacity: 0.216; }
	21.875% { opacity: 0.282; }
	25% { opacity: 0.350; }
	28.125% { opacity: 0.418; }
	31.25% { opacity: 0.484; }
	34.375% { opacity: 0.544; }
	37.5% { opacity: 0.597; }
	40.625% { opacity: 0.641; }
	43.75% { opacity: 0.673; }
	46.875% { opacity: 0.693; }
	50% { opacity: 0.700; }
	53.125% { opacity: 0.693; }
	56.25% { opacity: 0.673; }
	59.375% { opacity: 0.641; }
	62.5% { opacity: 0.597; }
	65.625% { opacity: 0.544; }
	68.75% { opacity: 0.484; }
	71.875% { opacity: 0.418; }
	75% { opacity: 0.350; }
	78.125% { opacity: 0.282; }
	81.25% { opacity: 0.216; }
	84.375% { opacity: 0.156; }
	87.5% { opacity: 0.103; }
	90.625% { opacity: 0.059; }
	93.75% { opacity: 0.027; }
	96.875% { opacity: 0.007; }
	100% { opacity: 0.000; }
}
#clock {
	font-size: 96px;
	font-weight: 300;
	letter-spacing: -2px;
	line-height: 1;
	font-variant-numeric: tabular-nums;
}
#date {
	font-size: 22px;
	font-weight: 500;
	color: var(--text-secondary);
}
#status {
	position: absolute;
	bottom: 28px;
	left: 0;
	right: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 10px;
	font-size: 15px;
	font-weight: 500;
	color: var(--text-secondary);
}
#dot {
	width: 8px;
	height: 8px;
	border-radius: 50%;
	background: var(--accent);
	animation: pulse 1.6s ease-in-out infinite;
}
#dot.error {
	background: var(--error);
}
@keyframes pulse {
	0%, 100% { opacity: 0.25; }
	50% { opacity: 1; }
}
.hidden {
	visibility: hidden;
}
#sign-in {
	display: flex;
	flex-direction: column;
	padding-top: 16px;
	box-sizing: border-box;
}
#sign-in header {
	padding: 0 16px 12px;
}
#sign-in h1 {
	margin: 0;
	font-size: 20px;
	font-weight: 600;
}
#host {
	margin-top: 2px;
	font-size: 14px;
	color: var(--text-secondary);
}
#fields {
	display: flex;
	flex-direction: column;
	gap: 8px;
	padding: 0 16px;
}
.field {
	display: flex;
	align-items: center;
	height: 46px;
	padding: 0 14px;
	border: 2px solid transparent;
	border-radius: 12px;
	background: var(--elevated);
	font-size: 18px;
}
.field.active {
	border-color: var(--primary);
}
.field .label {
	width: 96px;
	flex: none;
	font-size: 15px;
	color: var(--text-secondary);
}
.field .value {
	flex: 1;
	overflow: hidden;
	white-space: nowrap;
	text-overflow: clip;
	direction: rtl;
	text-align: left;
}
.field .value span {
	direction: ltr;
	unicode-bidi: bidi-override;
}
.field.active .value::after {
	content: "";
	display: inline-block;
	width: 2px;
	height: 22px;
	margin-left: 1px;
	vertical-align: middle;
	background: var(--primary);
	animation: caret 1s steps(1) infinite;
}
@keyframes caret {
	50% { opacity: 0; }
}
#error {
	min-height: 18px;
	padding: 8px 16px 0;
	font-size: 14px;
	font-weight: 500;
	color: var(--error);
}
#keyboard {
	margin-top: auto;
	display: flex;
	flex-direction: column;
	gap: 6px;
	padding: 4px 3px 6px;
}
.row {
	display: flex;
	gap: 4px;
	justify-content: center;
}
.key {
	flex: 1 1 0;
	max-width: 44px;
	height: 50px;
	display: flex;
	align-items: center;
	justify-content: center;
	border-radius: 8px;
	background: var(--key);
	font-size: 21px;
	font-weight: 500;
}
.key.special {
	max-width: none;
	flex-grow: 1.5;
	background: var(--key-special);
	font-size: 16px;
}
.key.space {
	max-width: none;
	flex-grow: 5;
}
.key.enter {
	max-width: none;
	flex-grow: 2.5;
	background: var(--primary);
	font-size: 17px;
	font-weight: 600;
}
.key.enter.busy {
	opacity: 0.5;
}
.key.pressed {
	filter: brightness(1.6);
}
.key.on {
	background: var(--text);
	color: var(--surface);
}
</style>
</head>
<body>
<main id="home" class="view">
	<div id="logo" role="img" aria-label="WallView">
		<div class="halo"></div>
		<img class="glow" src="logo-glow.svg" alt="">
		<img src="logo.svg" alt="">
		<img class="tint" src="logo-alt.svg" alt="">
	</div>
	<div id="clock" class="hidden">--:--</div>
	<div id="date" class="hidden"></div>
	<div id="status"><span id="dot"></span><span id="message">Connecting to Home Assistant…</span></div>
</main>
<section id="sign-in" class="view" hidden>
	<header>
		<h1>Sign in to Home Assistant</h1>
		<div id="host"></div>
	</header>
	<div id="fields"></div>
	<div id="error"></div>
	<div id="keyboard"></div>
</section>
<script>
const SIGNED_IN_KEY = "wallview.signedIn";
const RETRY_MS = 5000;
const LABELS = { username: "Username", password: "Password", code: "Code" };
const ERRORS = { invalid_auth: "Wrong username or password", invalid_code: "Wrong code" };
const LAYOUTS = {
	letters: ["qwertyuiop", "asdfghjkl", "zxcvbnm"],
	numbers: ["1234567890", "-/:;()$&@\"", ".,?!'_"],
	symbols: ["[]{}#%^*+=", "\\|~<>€£¥•`", ".,?!'_"],
};

const target = location.hash.slice(1);
const query = new URLSearchParams(location.search);
const signInGeneration = query.get("sign-in") || "0";
const pairing = query.get("pairing") || "";
const hassUrl = originOf(target);
const clientId = `${hassUrl}/`;
const signInMarker = `${hassUrl} ${signInGeneration}`;

const clock = document.getElementById("clock");
const date = document.getElementById("date");
const dot = document.getElementById("dot");
const message = document.getElementById("message");
const fieldList = document.getElementById("fields");
const errorLine = document.getElementById("error");
const keyboard = document.getElementById("keyboard");
const timeFormat = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hour12: false });
const dateFormat = new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long" });

const signIn = { flowId: null, fields: [], active: 0, layout: "letters", shift: false, busy: false };

function originOf(url) {
	try {
		return new URL(url).origin;
	} catch (error) {
		return "";
	}
}

function showView(id) {
	for (const view of document.querySelectorAll(".view")) {
		view.hidden = view.id !== id;
	}
}

function updateClock() {
	const now = new Date();
	const synchronized = now.getFullYear() >= 2025;
	clock.classList.toggle("hidden", !synchronized);
	date.classList.toggle("hidden", !synchronized);
	if (synchronized) {
		clock.textContent = timeFormat.format(now);
		date.textContent = dateFormat.format(now);
	}
}

function isSignedIn() {
	try {
		return localStorage.getItem(SIGNED_IN_KEY) === signInMarker;
	} catch (error) {
		return false;
	}
}

async function tryTarget() {
	if (!hassUrl) {
		dot.classList.add("error");
		message.textContent = "No dashboard URL configured";
		return;
	}
	try {
		await fetch(target, { mode: "no-cors", cache: "no-store" });
	} catch (error) {
		setTimeout(tryTarget, RETRY_MS);
		return;
	}
	if (pairing) {
		pair();
	} else if (isSignedIn()) {
		location.replace(target);
	} else {
		startSignIn();
	}
}

async function request(path, body) {
	const options = body === undefined
		? { cache: "no-store" }
		: { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
	let response;
	try {
		response = await fetch(`${hassUrl}${path}`, options);
	} catch (error) {
		throw new Error("Home Assistant is not reachable");
	}
	const data = await response.json().catch(() => ({}));
	if (!response.ok) {
		throw new Error(data.message || `Home Assistant answered ${response.status}`);
	}
	return data;
}

async function startSignIn() {
	document.getElementById("host").textContent = new URL(hassUrl).host;
	showView("sign-in");
	renderKeyboard();
	try {
		const answer = await request("/auth/providers");
		const providers = Array.isArray(answer) ? answer : answer.providers || [];
		const provider = providers.find((item) => item.type === "homeassistant") || providers[0];
		if (!provider) {
			throw new Error("Home Assistant offers no sign-in method");
		}
		showStep(await request("/auth/login_flow", {
			client_id: clientId,
			handler: [provider.type, provider.id],
			redirect_uri: `${hassUrl}/?auth_callback=1`,
		}));
	} catch (error) {
		errorLine.textContent = error.message;
		setTimeout(startSignIn, RETRY_MS);
	}
}

function showStep(step) {
	if (step.type === "create_entry") {
		finishSignIn(step.result);
		return;
	}
	if (step.type !== "form") {
		errorLine.textContent = "Sign-in expired, starting again";
		setTimeout(startSignIn, RETRY_MS);
		return;
	}
	const previous = Object.fromEntries(signIn.fields.map((field) => [field.name, field.value]));
	signIn.flowId = step.flow_id;
	signIn.fields = (step.data_schema || []).map((field) => ({
		name: field.name,
		value: field.name === "username" ? previous.username || "" : "",
	}));
	signIn.active = Math.max(0, signIn.fields.findIndex((field) => field.value === ""));
	signIn.layout = signIn.fields[signIn.active]?.name === "code" ? "numbers" : "letters";
	const code = step.errors && step.errors.base;
	errorLine.textContent = code ? ERRORS[code] || code : "";
	renderFields();
	renderKeyboard();
}

async function submitSignIn() {
	const empty = signIn.fields.findIndex((field) => field.value === "");
	if (empty !== -1) {
		signIn.active = empty;
		renderFields();
		return;
	}
	signIn.busy = true;
	renderKeyboard();
	const values = Object.fromEntries(signIn.fields.map((field) => [field.name, field.value]));
	try {
		showStep(await request(`/auth/login_flow/${signIn.flowId}`, { client_id: clientId, ...values }));
	} catch (error) {
		errorLine.textContent = error.message;
	} finally {
		signIn.busy = false;
		renderKeyboard();
	}
}

function markSignedIn() {
	try {
		localStorage.setItem(SIGNED_IN_KEY, signInMarker);
	} catch (error) {
	}
}

async function pair() {
	try {
		const tokens = await request("/api/wallview/pair", { secret: pairing, client_id: clientId });
		markSignedIn();
		const url = new URL("/api/wallview/pair", hassUrl);
		url.hash = new URLSearchParams({ tokens: JSON.stringify(tokens), next: target }).toString();
		location.replace(url.href);
	} catch (error) {
		await startSignIn();
		errorLine.textContent = `Automatic sign-in failed: ${error.message}`;
	}
}

function finishSignIn(code) {
	markSignedIn();
	const url = new URL(target);
	url.searchParams.set("auth_callback", "1");
	url.searchParams.set("code", code);
	url.searchParams.set("state", btoa(JSON.stringify({ hassUrl, clientId })));
	url.searchParams.set("storeToken", "true");
	location.replace(url.href);
}

function renderFields() {
	fieldList.replaceChildren(...signIn.fields.map((field, index) => {
		const row = document.createElement("div");
		row.className = index === signIn.active ? "field active" : "field";
		const label = document.createElement("span");
		label.className = "label";
		label.textContent = LABELS[field.name] || field.name;
		const value = document.createElement("span");
		value.className = "value";
		const text = document.createElement("span");
		text.textContent = field.name === "password" ? "•".repeat(field.value.length) : field.value;
		value.append(text);
		row.append(label, value);
		row.addEventListener("click", () => {
			signIn.active = index;
			renderFields();
		});
		return row;
	}));
}

function makeKey(label, className, action) {
	const key = document.createElement("div");
	key.className = className ? `key ${className}` : "key";
	key.textContent = label;
	key.addEventListener("click", () => {
		key.classList.add("pressed");
		setTimeout(() => key.classList.remove("pressed"), 120);
		action();
	});
	return key;
}

function type(character) {
	const field = signIn.fields[signIn.active];
	if (!field || signIn.busy) {
		return;
	}
	field.value += character;
	if (signIn.shift) {
		signIn.shift = false;
		renderKeyboard();
	}
	renderFields();
}

function backspace() {
	const field = signIn.fields[signIn.active];
	if (field && !signIn.busy) {
		field.value = field.value.slice(0, -1);
		renderFields();
	}
}

function enter() {
	if (signIn.busy) {
		return;
	}
	if (signIn.active < signIn.fields.length - 1) {
		signIn.active += 1;
		renderFields();
		renderKeyboard();
	} else {
		submitSignIn();
	}
}

function switchLayout(layout) {
	signIn.layout = layout;
	signIn.shift = false;
	renderKeyboard();
}

function renderKeyboard() {
	const rows = LAYOUTS[signIn.layout];
	const letters = signIn.layout === "letters";
	const characterKeys = (characters) => [...characters].map((character) => {
		const shown = letters && signIn.shift ? character.toUpperCase() : character;
		return makeKey(shown, "", () => type(shown));
	});
	const row = (...keys) => {
		const element = document.createElement("div");
		element.className = "row";
		element.append(...keys);
		return element;
	};
	const modifier = letters
		? makeKey("⇧", signIn.shift ? "special on" : "special", () => {
			signIn.shift = !signIn.shift;
			renderKeyboard();
		})
		: makeKey(signIn.layout === "numbers" ? "#+=" : "123", "special", () => switchLayout(signIn.layout === "numbers" ? "symbols" : "numbers"));
	const last = signIn.active >= signIn.fields.length - 1;
	keyboard.replaceChildren(
		row(...characterKeys(rows[0])),
		row(...characterKeys(rows[1])),
		row(modifier, ...characterKeys(rows[2]), makeKey("⌫", "special", backspace)),
		row(
			makeKey(letters ? "123" : "ABC", "special", () => switchLayout(letters ? "numbers" : "letters")),
			makeKey("", "space", () => type(" ")),
			makeKey(signIn.busy ? "…" : last ? "Sign in" : "Next", signIn.busy ? "enter busy" : "enter", enter),
		),
	);
}

updateClock();
setInterval(updateClock, 1000);
tryTarget();
</script>
</body>
</html>
