name: WallView OS root file system

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "buildroot/**"
      - "agent/**"
      - "initramfs/wallview-boot"
      - ".github/workflows/rootfs.yml"

concurrency:
  group: rootfs
  cancel-in-progress: false

env:
  BUILDROOT_VERSION: 2026.02.3
  BR2_DL_DIR: /home/runner/br-dl

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /opt/microsoft /usr/share/swift
          sudo docker system prune --all --force >/dev/null 2>&1 || true
          df -h /
          nproc
          free -g

      - name: Install host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential file cpio unzip rsync bc wget python3 libncurses-dev wpasupplicant libdbus-1-dev pkg-config

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.100.0

      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
            /home/runner/build/agent-target
          key: agent-${{ hashFiles('agent/Cargo.lock') }}-${{ hashFiles('agent/src/**', 'agent/build.rs', 'agent/proto/**') }}
          restore-keys: agent-${{ hashFiles('agent/Cargo.lock') }}-

      - name: Fetch Buildroot
        run: git clone -q --depth 1 --branch "$BUILDROOT_VERSION" https://gitlab.com/buildroot.org/buildroot.git "$HOME/buildroot"

      - name: Compute Buildroot output cache key
        id: key
        run: echo "output=br-output-v1-$BUILDROOT_VERSION-${{ hashFiles('buildroot/configs/**', 'buildroot/Config.in', 'buildroot/external.mk', 'buildroot/external.desc') }}" >> "$GITHUB_OUTPUT"

      - name: Restore Buildroot output
        id: output
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/br
          key: ${{ steps.key.outputs.output }}

      - name: Restore downloads and compiler cache
        if: steps.output.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/br-dl
            /home/runner/.buildroot-ccache
          key: buildroot-${{ env.BUILDROOT_VERSION }}-${{ github.run_id }}
          restore-keys: buildroot-${{ env.BUILDROOT_VERSION }}-

      - name: Mark restored packages as built
        if: steps.output.outputs.cache-hit == 'true'
        run: |
          find "$HOME/br/build" -name '.stamp_*' -exec touch {} +
          du -sh "$HOME/br"

      - name: Build
        run: |
          make -s -C "$HOME/buildroot" O="$HOME/br" BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" wallview_defconfig
          timeout 315m make -C "$HOME/buildroot" O="$HOME/br" BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" BR2_JLEVEL=4 2>&1 | tee build.log | grep --line-buffered '^>>>' || {
            status=$?
            tail -60 build.log
            exit $status
          }
          tail -5 build.log
          ls -l "$HOME/br/images"
          df -h /

      - name: Save downloads and compiler cache
        if: always() && steps.output.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/br-dl
            /home/runner/.buildroot-ccache
          key: buildroot-${{ env.BUILDROOT_VERSION }}-${{ github.run_id }}

      - name: Keep only installed results and stamps
        if: steps.output.outputs.cache-hit != 'true'
        run: |
          mv "$HOME/br/images" "$HOME/images"
          find "$HOME/br/build" -mindepth 2 -maxdepth 2 ! -name '.*' ! -path "$HOME/br/build/buildroot-config/*" -exec rm -rf {} +
          rm -rf "$HOME/br/build/buildroot-fs"
          du -sh "$HOME/br"

      - name: Save Buildroot output
        if: steps.output.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/br
          key: ${{ steps.key.outputs.output }}

      - name: Put images back
        if: steps.output.outputs.cache-hit != 'true'
        run: mv "$HOME/images" "$HOME/br/images"

      - name: Upload root file system
        uses: actions/upload-artifact@v4
        with:
          name: wallview-rootfs
          path: /home/runner/br/images/rootfs.erofs
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
