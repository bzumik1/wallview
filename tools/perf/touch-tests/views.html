<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohledy švihem</title>
<link rel="stylesheet" href="common.css">
<style>
html, body { height: 100%; overflow: hidden; }
#tabs { position: fixed; top: 40px; left: 0; right: 0; height: 40px; display: flex; overflow: hidden; background: var(--bg); border-bottom: 1px solid #2c313b; z-index: 5; }
#tabs div { flex: 1; display: grid; place-items: center; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
#tabs div.cur { color: var(--text); border-bottom-color: var(--blue); }
#views { position: fixed; top: 80px; left: 0; right: 0; bottom: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
#views::-webkit-scrollbar { display: none; }
.view { flex: none; width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 90px; gap: 10px; align-content: start; }
.view .t { border-radius: 14px; background: var(--card); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
.view .t b { font-weight: 500; }
.view h3 { grid-column: 1 / -1; margin: 0; font-size: 22px; height: auto; }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="views"></div>
<script src="common.js"></script>
<script>
const names = ["Obývák", "Kuchyň", "Ložnice", "Koupelna", "Pracovna", "Zahrada"];
const views = document.getElementById("views");
const tabs = document.getElementById("tabs");
tabs.innerHTML = names.map((n) => `<div>${n}</div>`).join("");
views.innerHTML = names.map((n, i) => `<section class="view"><h3>${n}</h3>${Array.from({ length: 6 }, (_, k) => `<div class="t"><b>${["Světlo", "Teplota", "Roleta", "Zásuvka", "Okno", "Hudba"][k]}</b><span>${["💡", "🌡️", "🪟", "🔌", "🪟", "🎵"][k]}</span></div>`).join("")}</section>`).join("");
const index = () => Math.round(views.scrollLeft / views.clientWidth);
function mark() {
	const i = index();
	[...tabs.children].forEach((t, k) => t.classList.toggle("cur", k === i));
}
views.addEventListener("scroll", mark, { passive: true });
tabs.addEventListener("click", (e) => {
	const k = [...tabs.children].indexOf(e.target);
	if (k >= 0) {
		views.scrollTo({ left: k * views.clientWidth, behavior: "smooth" });
	}
});
mark();
let g = null;
let ok = 0;
let missed = 0;
let skipped = 0;
let settle = [];
function show() {
	const s = [...settle].sort((a, b) => a - b);
	tt.set("švihy", `přepnuto ${ok}  nepřepnuto ${missed}  přeskočeno ${skipped}`);
	tt.set("dojezd", s.length ? `medián ${s[Math.floor(s.length / 2)]} ms` : "-");
}
tt.onReset(() => {
	ok = missed = skipped = 0;
	settle = [];
	show();
});
show();
views.addEventListener("touchstart", (e) => {
	g = { x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, dy: 0, from: index() };
}, { passive: true });
views.addEventListener("touchmove", (e) => {
	if (g) {
		g.dx = e.touches[0].clientX - g.x;
		g.dy = e.touches[0].clientY - g.y;
	}
}, { passive: true });
views.addEventListener("touchend", () => {
	const s = g;
	g = null;
	if (!s || Math.abs(s.dx) < 40 || Math.abs(s.dx) < Math.abs(s.dy)) {
		return;
	}
	const want = Math.max(0, Math.min(names.length - 1, s.from + (s.dx < 0 ? 1 : -1)));
	if (want === s.from) {
		return;
	}
	const t0 = performance.now();
	let last = views.scrollLeft;
	let still = t0;
	function wait(now) {
		if (views.scrollLeft !== last) {
			last = views.scrollLeft;
			still = now;
		}
		if (now - still < 150 && now - t0 < 2000) {
			requestAnimationFrame(wait);
			return;
		}
		const to = index();
		const result = to === want ? "ok" : to === s.from ? "missed" : "skipped";
		if (result === "ok") {
			ok++;
		} else if (result === "missed") {
			missed++;
		} else {
			skipped++;
		}
		settle.push(Math.round(still - t0));
		tt.record("view-swipe", { result, from: s.from, to, want, dx: Math.round(s.dx), settle: Math.round(still - t0) });
		show();
	}
	requestAnimationFrame(wait);
}, { passive: true });
</script>
</body>
</html>
