[package]
name = "wallview-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Home Assistant integration of the WallView panel over MQTT"

[dependencies]
rumqttc = { version = "0.24", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
