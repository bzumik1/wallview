[package]
name = "wallview-agent"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Home Assistant integration of the WallView panel: ESPHome native API, optional MQTT"

[dependencies]
base64 = "0.22"
libc = "0.2"
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
mdns-sd = "0.13"
pbkdf2 = { version = "0.12", features = ["hmac"] }
prost = "0.13"
rumqttc = { version = "0.24", default-features = false }
serde_json = "1"
sha1 = "0.10"
snow = "0.9"
tokio = { version = "1", features = ["rt", "time", "sync"] }

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
